# =============================================================================
# Configuration de l'application de tests Karate Petstore
# =============================================================================
# Ce fichier peut être utilisé pour surcharger la configuration par environnement
# Copier ce fichier en application-{env}.properties pour chaque environnement
# =============================================================================

# -----------------------------------------------------------------------------
# URL de base de l'API
# -----------------------------------------------------------------------------
api.base.url=http://petstore.swagger.io/v2

# -----------------------------------------------------------------------------
# Authentification
# -----------------------------------------------------------------------------
# Clé API pour les endpoints sécurisés
# Utilisez 'special-key' pour tester les filtres d'autorisation
api.key=special-key

# OAuth2 (si nécessaire)
# oauth.client.id=your-client-id
# oauth.client.secret=your-client-secret
# oauth.token.url=http://petstore.swagger.io/api/oauth/dialog

# -----------------------------------------------------------------------------
# Timeouts (en millisecondes)
# -----------------------------------------------------------------------------
api.connect.timeout=30000
api.read.timeout=30000

# -----------------------------------------------------------------------------
# Configuration des tests
# -----------------------------------------------------------------------------
# Nombre de threads parallèles
test.parallel.threads=5

# Retry configuration
test.retry.count=2
test.retry.interval=1000

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Niveaux: TRACE, DEBUG, INFO, WARN, ERROR
log.level=INFO
log.karate.level=DEBUG
log.http.level=DEBUG

# -----------------------------------------------------------------------------
# Rapports
# -----------------------------------------------------------------------------
report.output.dir=target/karate-reports
report.cucumber.json=true
report.junit.xml=true

# -----------------------------------------------------------------------------
# Données de test
# -----------------------------------------------------------------------------
# Préfixe pour les données générées
test.data.prefix=test_

# Nettoyage automatique après tests
test.cleanup.enabled=true
